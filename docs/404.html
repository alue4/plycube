<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <title>Plycube</title>
  <!-- Une adresse comme https://pseudo.github.io/plycube/games/fps/ renvoie vers la même page du site :
       https://jeu-sjdc.lleyn-bass.ts.net/games/fps/ -->
  <meta http-equiv="refresh" content="0; url=https://jeu-sjdc.lleyn-bass.ts.net/">
  <script>
    // Sur pseudo.github.io, le premier morceau du chemin est le nom du dépôt (/plycube) : on l'enlève.
    var chemin = location.hostname.endsWith('.github.io') ? location.pathname.replace(/^\/[^/]+/, '') : location.pathname;
    location.replace('https://jeu-sjdc.lleyn-bass.ts.net' + (chemin || '/') + location.search + location.hash);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05070d; color: #e8eef9; font-family: "Segoe UI", system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div>
    <p>Direction Plycube…</p>
    <p><a href="https://jeu-sjdc.lleyn-bass.ts.net/">Clique ici si rien ne se passe</a></p>
  </div>
</body>
</html>
