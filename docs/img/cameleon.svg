<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd4a8"/>
      <stop offset="1" stop-color="#1f7a63"/>
    </linearGradient>
    <linearGradient id="peau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8f06a"/>
      <stop offset="1" stop-color="#3bb34a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ciel)"/>
  <!-- un mur à motifs (le décor) -->
  <g opacity=".9">
    <rect x="0" y="230" width="640" height="130" fill="#f5e6c8"/>
    <g fill="#ead2a4">
      <rect x="0" y="230" width="20" height="130"/><rect x="40" y="230" width="20" height="130"/><rect x="80" y="230" width="20" height="130"/>
      <rect x="120" y="230" width="20" height="130"/><rect x="160" y="230" width="20" height="130"/><rect x="200" y="230" width="20" height="130"/>
      <rect x="240" y="230" width="20" height="130"/><rect x="280" y="230" width="20" height="130"/><rect x="320" y="230" width="20" height="130"/>
      <rect x="360" y="230" width="20" height="130"/><rect x="400" y="230" width="20" height="130"/><rect x="440" y="230" width="20" height="130"/>
      <rect x="480" y="230" width="20" height="130"/><rect x="520" y="230" width="20" height="130"/><rect x="560" y="230" width="20" height="130"/>
      <rect x="600" y="230" width="20" height="130"/>
    </g>
  </g>
  <!-- le caméléon en blocs -->
  <g transform="translate(150 70)">
    <rect x="40" y="70" width="230" height="110" rx="14" fill="url(#peau)"/>
    <rect x="250" y="40" width="120" height="110" rx="14" fill="url(#peau)"/>
    <rect x="300" y="60" width="44" height="44" rx="8" fill="#ffffff"/>
    <rect x="316" y="72" width="22" height="22" rx="4" fill="#1d2b1f"/>
    <rect x="352" y="120" width="70" height="12" rx="6" fill="#ff6b9a"/>
    <circle cx="430" cy="126" r="12" fill="#ff6b9a"/>
    <path d="M40 120 h-40 a40 40 0 1 0 40 40 v-24 h-10 a14 14 0 1 1 -14 -14 h24 z" fill="#3bb34a"/>
    <rect x="70" y="170" width="34" height="50" rx="6" fill="#2f9a40"/>
    <rect x="210" y="170" width="34" height="50" rx="6" fill="#2f9a40"/>
    <!-- la moitié arrière se fond dans le mur -->
    <g opacity=".85">
      <rect x="40" y="70" width="100" height="110" rx="14" fill="#f5e6c8"/>
      <rect x="60" y="70" width="18" height="110" fill="#ead2a4"/><rect x="100" y="70" width="18" height="110" fill="#ead2a4"/>
    </g>
    <!-- tache de peinture -->
    <circle cx="200" cy="40" r="22" fill="#e84393"/><circle cx="226" cy="22" r="9" fill="#e84393"/><circle cx="172" cy="16" r="7" fill="#e84393"/>
  </g>
  <text x="320" y="335" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="#14513f" stroke-width="6" paint-order="stroke">CAMÉLÉON</text>
</svg>
