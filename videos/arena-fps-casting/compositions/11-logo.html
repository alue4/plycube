<!DOCTYPE html>
<html lang="fr">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; font-weight: 400; src: url("assets/fonts/ArchivoBlack-400.woff2") format("woff2"); }
        @font-face { font-family: "Space Mono"; font-weight: 700; src: url("assets/fonts/SpaceMono-700.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; }
        #s11-voile { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 15, 29, .86) 0%, rgba(10, 15, 29, .74) 55%, rgba(10, 15, 29, 0) 76%); }
        #s11-pixels { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .s11-px { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 5px; }
        #s11-logo { position: absolute; left: 92px; top: 300px; width: 1150px; margin: 0; white-space: nowrap;
          font: italic 400 192px/1 "Archivo Black", sans-serif; letter-spacing: -0.04em; color: #eef4ff; text-shadow: 0 14px 0 #1d2a4d, 0 30px 60px rgba(0, 0, 0, .5); }
        #s11-logo span { color: #ff8a1f; text-shadow: 0 14px 0 #a14e0a, 0 30px 60px rgba(0, 0, 0, .5); }
        #s11-infos { position: absolute; left: 100px; top: 590px; font: 700 46px/1 "Space Mono", monospace; letter-spacing: .02em; color: #eef4ff; }
        #s11-appel { position: absolute; left: 100px; top: 668px; font: 700 38px/1.2 "Space Mono", monospace; color: #7fe8ff; }
        #s11-beta { position: absolute; left: 100px; top: 226px; font: 700 28px/1 "Space Mono", monospace; letter-spacing: .12em; color: #0a0f1d; background: #ff8a1f; padding: 8px 16px; border-radius: 999px; }
      </style>
      <div data-hf-id="hf-ddfm" id="root" data-composition-id="s11" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ex76" id="s11-voile"></div>
        <div data-hf-id="hf-dgjg" id="s11-pixels"></div>
        <div data-hf-id="hf-gonm" id="s11-beta">BÊTA · JEU SJDC</div>
        <h1 data-hf-id="hf-99uj" id="s11-logo">ARENA <span data-hf-id="hf-5w6s">FPS</span></h1>
        <div data-hf-id="hf-xj6r" id="s11-infos">4 cartes · 21 armes · 2 à 10 joueurs</div>
        <div data-hf-id="hf-2hka" id="s11-appel">Joue avec tes potes sur Jeu SJDC</div>
      </div>
      <script>
        // Les pixels de l'ouverture volent et s'assemblent à l'emplacement du logo (hasard calculé à partir du numéro).
        const COULEURS = ["#f1c7a0", "#2b1d0e", "#ff8a1f", "#3d8bff", "#7fe8ff", "#8a3b3b", "#eef4ff", "#ffd21f"];
        const boite = document.getElementById("s11-pixels");
        const hasard = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
        const COLS = 22; const LIGNES = 4;
        const px = [];
        for (let i = 0; i < COLS * LIGNES; i++) {
          const d = document.createElement("div");
          d.className = "s11-px";
          d.style.background = COULEURS[i % COULEURS.length];
          boite.appendChild(d);
          px.push(d);
        }
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s11-voile", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.2);
        px.forEach((d, i) => {
          const cx = 110 + (i % COLS) * 50; const cy = 318 + Math.floor(i / COLS) * 50;
          const x0 = -200 + hasard(i, 1) * 2300; const y0 = -260 + hasard(i, 2) * 1600;
          const t = 0.45 + hasard(i, 3) * 0.35;
          tl.fromTo(d, { x: x0, y: y0, rotation: -180 + hasard(i, 4) * 360, scale: 0.4 + hasard(i, 5) },
            { x: cx, y: cy, rotation: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
          tl.to(d, { scale: 0, duration: 0.18, ease: "power2.in" }, 1.42 + (i % COLS) * 0.012);
        });
        tl.fromTo("#s11-logo", { opacity: 0, scale: 0.92, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.4);
        tl.fromTo("#s11-beta", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.75);
        tl.fromTo("#s11-infos", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.95);
        tl.fromTo("#s11-appel", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.25);
        tl.fromTo("#s11-logo", { y: 0 }, { y: -8, duration: 3, ease: "sine.inOut", immediateRender: false }, 2.4);
        window.__timelines["s11"] = tl;
      </script>
    </template>
  </body>
</html>
